name: Test & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── 1. Тесты ────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Inject secrets
        env:
          BITRIX_CRM_WEBHOOK:   ${{ secrets.BITRIX_CRM_WEBHOOK }}
          BITRIX_LISTS_WEBHOOK: ${{ secrets.BITRIX_LISTS_WEBHOOK }}
          DADATA_TOKEN:         ${{ secrets.DADATA_TOKEN }}
        run: |
          sed -i "s|__BITRIX_CRM_WEBHOOK__|${BITRIX_CRM_WEBHOOK}|g"     js/bitrix.js
          sed -i "s|__BITRIX_LISTS_WEBHOOK__|${BITRIX_LISTS_WEBHOOK}|g"  js/bitrix.js
          sed -i "s|__DADATA_TOKEN__|${DADATA_TOKEN}|g"                  index.html

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Start local server
        run: python3 -m http.server 8080 &

      - name: Wait for server
        run: sleep 2 && curl -sf http://localhost:8080/ > /dev/null

      - name: Run Playwright tests
        run: BASE_URL=http://localhost:8080/ npx playwright test

      - name: Upload report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── 2. Деплой (только если тесты прошли) ────────────────────────────────────
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject secrets
        env:
          BITRIX_CRM_WEBHOOK:   ${{ secrets.BITRIX_CRM_WEBHOOK }}
          BITRIX_LISTS_WEBHOOK: ${{ secrets.BITRIX_LISTS_WEBHOOK }}
          DADATA_TOKEN:         ${{ secrets.DADATA_TOKEN }}
        run: |
          sed -i "s|__BITRIX_CRM_WEBHOOK__|${BITRIX_CRM_WEBHOOK}|g"     js/bitrix.js
          sed -i "s|__BITRIX_LISTS_WEBHOOK__|${BITRIX_LISTS_WEBHOOK}|g"  js/bitrix.js
          sed -i "s|__DADATA_TOKEN__|${DADATA_TOKEN}|g"                  index.html

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
