<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Акселератор × Сколково — Новый пароль</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#1e2849;--teal:#00b0bd;--green:#00b37d;--bg:#f0f2f7;--sur:#fff;--bdr:rgba(30,40,73,.1);--txt:#1e2849;--txt2:#6b7290;--r:12px;--rs:8px;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Golos Text',sans-serif;background:var(--bg);min-height:100vh;}
    .tb{position:fixed;top:0;left:0;right:0;height:64px;background:var(--navy);display:flex;align-items:center;padding:0 24px;gap:12px;z-index:100;}
    .ax-badge{background:var(--teal);color:#fff;font-family:'Unbounded',sans-serif;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;letter-spacing:.5px;}
    .tb-sep{width:1px;height:24px;background:rgba(255,255,255,.18);}
    .sko-dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
    .tb-sko{display:flex;align-items:center;gap:8px;}
    .tb-sko span{color:rgba(255,255,255,.8);font-size:13px;}
    .wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:80px 16px 32px;}
    .card{background:var(--sur);border-radius:var(--r);border:1px solid var(--bdr);width:100%;max-width:440px;overflow:hidden;box-shadow:0 4px 24px rgba(30,40,73,.08);}
    .card-h{background:var(--navy);padding:28px 32px;}
    .card-title{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:700;color:#fff;margin-bottom:4px;}
    .card-sub{font-size:12px;color:rgba(255,255,255,.55);}
    .form-body{padding:24px 32px;}
    .field{margin-bottom:16px;}
    .label{font-size:12px;font-weight:600;color:var(--txt);margin-bottom:5px;display:block;}
    .label span{color:#c00;}
    .input{width:100%;padding:10px 12px;border:1px solid var(--bdr);border-radius:var(--rs);font-family:'Golos Text',sans-serif;font-size:13px;color:var(--txt);background:#f7f8fb;transition:border .2s;}
    .input:focus{outline:none;border-color:var(--teal);background:#fff;}
    .divider{height:1px;background:var(--bdr);margin:4px 0 16px;}
    .btn-submit{width:100%;padding:12px;background:var(--teal);color:#fff;border:none;border-radius:var(--rs);font-family:'Golos Text',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s;}
    .btn-submit:hover{background:#00c9d8;}
    .btn-submit:disabled{opacity:.6;cursor:not-allowed;}
    .error-msg{background:rgba(200,0,0,.07);border:1px solid rgba(200,0,0,.2);border-radius:var(--rs);padding:10px 14px;font-size:12px;color:#c00;margin-bottom:16px;display:none;}
    .error-msg.show{display:block;}
    .success-box{background:rgba(0,179,125,.07);border:1px solid rgba(0,179,125,.3);border-radius:var(--rs);padding:16px;font-size:13px;color:var(--navy);line-height:1.6;display:none;}
    .success-box.show{display:block;}
  </style>
</head>
<body>

<header class="tb">
  <div class="ax-badge">АКСЕЛЕРАТОР</div>
  <div class="tb-sep"></div>
  <div class="tb-sko"><div class="sko-dot"></div><span>Сколково</span></div>
</header>

<div class="wrap">
  <div class="card">
    <div class="card-h">
      <div class="card-title">Новый пароль</div>
      <div class="card-sub">Программа Акселератор × Сколково</div>
    </div>
    <div class="form-body">
      <div class="error-msg" id="err"></div>
      <div class="success-box" id="ok">
        Пароль успешно изменён. <a href="index.html" style="color:var(--teal)">Войти в кабинет</a>
      </div>

      <div id="form-fields">
        <p style="font-size:13px;color:var(--txt2);margin-bottom:18px;line-height:1.6">
          Придумайте новый пароль для вашего кабинета.
        </p>
        <div class="field">
          <label class="label" for="pw">Новый пароль <span>*</span></label>
          <input class="input" id="pw" type="password" placeholder="Минимум 8 символов" autocomplete="new-password">
        </div>
        <div class="field">
          <label class="label" for="pw2">Повтор пароля <span>*</span></label>
          <input class="input" id="pw2" type="password" placeholder="Повторите пароль" autocomplete="new-password">
        </div>
        <div class="divider"></div>
        <button class="btn-submit" id="btn-save">Сохранить пароль</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import Auth from './js/auth.js';

const token = new URLSearchParams(location.search).get('token');

if (!token) {
  document.getElementById('err').textContent = 'Ссылка недействительна. Запросите сброс пароля заново.';
  document.getElementById('err').classList.add('show');
  document.getElementById('form-fields').style.display = 'none';
}

document.getElementById('btn-save')?.addEventListener('click', async () => {
  const errEl = document.getElementById('err');
  errEl.classList.remove('show');

  const pw  = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;

  if (!pw)        { errEl.textContent = 'Введите новый пароль'; errEl.classList.add('show'); return; }
  if (pw.length < 8) { errEl.textContent = 'Пароль должен содержать минимум 8 символов'; errEl.classList.add('show'); return; }
  if (pw !== pw2) { errEl.textContent = 'Пароли не совпадают'; errEl.classList.add('show'); return; }

  const btn = document.getElementById('btn-save');
  btn.textContent = 'Сохраняем...';
  btn.disabled = true;

  try {
    await Auth.resetPassword(token, pw);
    document.getElementById('form-fields').style.display = 'none';
    document.getElementById('ok').classList.add('show');
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.add('show');
    btn.textContent = 'Сохранить пароль';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
